<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <!-- Viewport adaptado para evitar zoom em formulários no iOS e respeitar a Safe Area (Notch do iPhone) -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Garimpo de Ofertas | Cupons e Achadinhos Testados</title>
    
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

    <!-- DADOS ESTRUTURADOS (VSO - Voice Search Optimization) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [{
        "@type": "Question",
        "name": "Onde encontrar os melhores cupons da Shopee hoje?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "O Garimpo de Ofertas testa e valida diariamente os melhores cupons e produtos. Você pode acessar a lista atualizada no nosso Grupo VIP gratuito."
        }
      }]
    }
    </script>
</head>
<body class="mobile-optimized">

    <!-- Container Principal do App -->
    <main class="app-content">
        
        <!-- Header Minimalista (Aparece mais no Desktop, fica invisível/menor no mobile) -->
        <header class="top-header">
            <div class="logo">GARIMPO<span>OFERTAS</span></div>
        </header>

        <!-- AQUI ENTRARÁ A NOSSA HERO SECTION E DEPOIS O SCROLL SNAP (Tópico 2) -->
        <section id="inicio" style="min-height: 100vh; padding: 20px;">
            <h1 class="vso-title">Aqui estão os melhores cupons e achadinhos testados para hoje.</h1>
            <p>Role para baixo ou use o menu para navegar.</p>
        </section>
        
        <section id="achadinhos" style="min-height: 100vh; padding: 20px;">
            <h2>Achadinhos (Futuro Scroll-Snap)</h2>
        </section>

    </main>

    <!-- BOTTOM NAVIGATION BAR (Thumb-Zone) -->
    <nav class="bottom-nav">
        <a href="#inicio" class="nav-item active" aria-label="Início">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
            <span>Início</span>
        </a>
        <a href="#achadinhos" class="nav-item" aria-label="Achadinhos">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect><line x1="8" y1="21" x2="16" y2="21"></line><line x1="12" y1="17" x2="12" y2="21"></line></svg>
            <span>Vitrines</span>
        </a>
        <a href="#isca" class="nav-item" aria-label="Checklist">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
            <span>Checklist</span>
        </a>
        <!-- Botão VIP com destaque (Call to Action principal) -->
        <a href="#vip" class="nav-item vip-action" aria-label="Grupo VIP">
            <div class="vip-icon-wrapper">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
            </div>
            <span>Grupo VIP</span>
        </a>
    </nav>

</body>
</html>
